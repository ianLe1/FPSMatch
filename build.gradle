plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'net.ptcrys'
version = '1.3.0-1.21.1-port'
base { archivesName = 'fpsmatch' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = '21.1.253'

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        fpsmatch {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // 1.21.1 本地生产 mod jar（本机实测：SRG 命中数 = 0，生产名即官方名，可直接参与编译）
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    // MixinExtras
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.3'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.3'

    // commons-math3：TaCZ 的 GunData.getRecoil().genPitchSplineFunction() 返回
    // org.apache.commons.math3.analysis.polynomials.PolynomialSplineFunction。
    // 运行期由 TaCZ 自带的 META-INF/jarjar/commons-math3-3.6.1.jar 提供（JarJar 自动加载），
    // 所以这里只需 compileOnly，不能打包、也不能声明为 required。
    compileOnly 'org.apache.commons:commons-math3:3.6.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '3000'
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-removal'
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
            'MixinConfigs'         : 'fpsmatch.mixins.json',
            'Specification-Title'  : 'FPSMatch',
            'Specification-Version': project.version,
            'Implementation-Title' : 'fpsmatch',
            'Implementation-Version': project.version,
    ])
}
